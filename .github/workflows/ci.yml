name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore coding-practice.sln

      - name: Verify formatting
        run: dotnet format coding-practice.sln --verify-no-changes --no-restore

      - name: Scan tracked files for common secret patterns
        shell: pwsh
        run: ./scripts/verify-secrets.ps1

      - name: Build
        run: dotnet build coding-practice.sln --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test coding-practice.sln
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Enforce coverage baseline
        shell: pwsh
        run: ./scripts/verify-coverage.ps1 -Path ./TestResults -MinimumLineRate 40
