name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore coding-practice.sln

      - name: Build
        run: dotnet build coding-practice.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test coding-practice.sln --configuration Release --no-build --no-restore
